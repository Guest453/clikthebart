<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICK THE BART</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            z-index: 10; 
            cursor: pointer;
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 1;
            filter: invert(100%);
            display: none; 
        }

        #flashing-cheeseball {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 15vw;
            font-weight: 900;
            text-align: center;
            word-wrap: break-word;
            line-height: 0.9;
        }

        #custom-popup-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 20px; z-index: 9999;
        }
        
        .sys-alert {
            background: white; border: 1px solid #ccc;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            border-radius: 4px; width: 320px; padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        
        .sys-alert-text {
            font-size: 14px; color: #333; margin-bottom: 24px;
        }
        
        .sys-btn {
            background: #0078d4; color: white; border: none;
            padding: 6px 20px; border-radius: 2px; font-size: 14px;
            cursor: pointer; float: right;
        }
        .sys-btn:hover { background: #005a9e; }
    </style>
</head>
<body>

    <video id="bg-video" loop playsinline muted>
        <source src="https://web.archive.org/web/20240716192911im_/https://nez.fyi/sml-assets/explode.webm" type="video/webm">
    </video>

    <div id="flashing-cheeseball">CHEESEBALL<br>CHEESEBALL</div>
    


    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgVideo = document.getElementById('bg-video');
        const flashingCheeseball = document.getElementById('flashing-cheeseball');
        const popupOverlay = document.getElementById('custom-popup-overlay');
        const startBtn = document.getElementById('start-btn');
        
        // Audio Setup using EXACT links provided
        const bgMusic = new Audio('https://web.archive.org/web/20240716192911/https://nez.fyi/sml-assets/ctb2.ogg');
        bgMusic.loop = true;

        const dubstepAudio = new Audio('https://web.archive.org/web/20240716192911/https://nez.fyi/sml-assets/bartstep.ogg');
        dubstepAudio.loop = true; 

        // Image Setup using EXACT link provided
        const bartImg = new Image();
        bartImg.src = 'https://upload.wikimedia.org/wikipedia/pt/a/aa/Bart_Simpson_200px.png';

        let state = 'WAITING'; // states: 'WAITING', 'BART', 'FALLING', 'DUBSTEP'
        let clickTime = 0;
        let dubstepStartTime = 0;
        
        const entity = {
            x: 0, y: 0,
            radius: 80, 
            imgWidth: 150, imgHeight: 200,
            vy: 0, gravity: 2.0, bounce: -0.6   
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(state === 'BART' || state === 'WAITING') {
                entity.x = canvas.width / 2;
                entity.y = canvas.height / 2;
            }
        }
        window.addEventListener('resize', resize);

        function drawBartPNG(x, y) {
            if (bartImg.complete && bartImg.naturalHeight !== 0) {
                ctx.drawImage(bartImg, x - entity.imgWidth / 2, y - entity.imgHeight / 2, entity.imgWidth, entity.imgHeight);
            }
        }

        function drawCheeseball(x, y, radius) {
            ctx.fillStyle = '#F59E0B'; 
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = '#D97706'; 
            ctx.beginPath(); ctx.arc(x - 20, y - 20, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 30, y - 10, 15, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x - 10, y + 25, 12, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 15, y + 20, 8, 0, Math.PI*2); ctx.fill();
        }

        // TITLE LOOP - Flashing different capitalizations rapidly
        const titleFrames = [
            "CLICK THE BART",
            "CLICK THE bART",
            "CLICK THE BaRT",
            "CLICK THE BArT",
            "CLICK THE BARt"
        ];
        let titleFrameIndex = 0;
        
        setInterval(() => {
            document.title = titleFrames[titleFrameIndex];
            titleFrameIndex = (titleFrameIndex + 1) % titleFrames.length;
        }, 100);

        // POPUP START EVENT
      window.onload = () => {
    resize();
    animate(); 
    // Trigger real native popup
    alert("Ready to experience it?");
    state = 'BART';
    bgVideo.style.display = 'block';
    bgVideo.play();
    bgMusic.play();
};s
        // CANVAS CLICK EVENT
        canvas.addEventListener('pointerdown', (e) => {
            if (state === 'BART') {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const dist = Math.hypot(mouseX - entity.x, mouseY - entity.y);
                
                if (dist <= Math.max(entity.radius, 100)) { // 100px generous click radius
                    state = 'FALLING';
                    clickTime = Date.now();
                    
                    // Stop pre-click media
                    bgMusic.pause();
                    bgVideo.pause();
                    bgVideo.style.display = 'none';
                    
                    // Pre-warm dubstep audio
                    dubstepAudio.play().then(() => {
                        dubstepAudio.pause();
                        dubstepAudio.currentTime = 0;
                    }).catch(e => console.log("Audio pending..."));
                }
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (state === 'BART') {
                drawBartPNG(entity.x, entity.y);
            } else if (state === 'FALLING' || state === 'DUBSTEP') {
                
                // Rapid Gravity Physics
                if (state === 'FALLING') {
                    entity.vy += entity.gravity;
                    entity.y += entity.vy;

                    // Floor Bounce
                    if (entity.y + entity.radius > canvas.height) {
                        entity.y = canvas.height - entity.radius;
                        entity.vy *= entity.bounce; 
                    }
                    drawCheeseball(entity.x, entity.y, entity.radius);

                    // 1 Second Drop Transition
                    if (Date.now() - clickTime >= 1000) {
                        state = 'DUBSTEP';
                        dubstepStartTime = Date.now();
                        
                        canvas.style.display = 'none'; // Hide canvas
                        flashingCheeseball.style.display = 'flex'; // Show massive text
                        
                        dubstepAudio.currentTime = 0;
                        dubstepAudio.play().catch(e => console.error("Autoplay blocked:", e));
                    }
                }

                if (state === 'DUBSTEP') {
                    // Flash CHEESEBALL text crazy colors
                    const r1 = Math.floor(Math.random() * 255);
                    const g1 = Math.floor(Math.random() * 255);
                    const b1 = Math.floor(Math.random() * 255);
                    const r2 = 255 - r1;
                    const g2 = 255 - g1;
                    const b2 = 255 - b1;
                    
                    flashingCheeseball.style.backgroundColor = `rgb(${r1}, ${g1}, ${b1})`;
                    flashingCheeseball.style.color = `rgb(${r2}, ${g2}, ${b2})`;

                    // 3 Second Redirect to websim.com
                    if (Date.now() - dubstepStartTime >= 3000) {
                        window.location.href = 'https://websim.com'; 
                    }
                }
            }

            requestAnimationFrame(animate); 
        }

        window.onload = () => {
            resize();
            animate(); 
        };
    </script>
</body>
</html>
