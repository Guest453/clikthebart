<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICK THE BART</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #f3f4f6; 
            font-family: 'Inter', sans-serif;
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            z-index: 10; 
            cursor: pointer;
        }
        #bg-gif {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        #ui-text {
            position: absolute;
            top: 10%; left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: 900;
            color: #111827;
            z-index: 20;
            pointer-events: none;
            text-shadow: 3px 3px 0px white;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="bg-gif"></div>
    <div id="ui-text">CLICK THE BART</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiText = document.getElementById('ui-text');
        
        // Audio Setup
        const dubstepAudio = new Audio('https://web.archive.org/web/20240716192911/https://nez.fyi/sml-assets/bartstep.ogg');
        dubstepAudio.loop = true; 

        let state = 'BART'; // states: 'BART', 'FALLING', 'DUBSTEP'
        let clickTime = 0;
        let dubstepStartTime = 0;
        
        let entity = {
            x: 0,
            y: 0,
            radius: 80,
            vy: 0,         
            gravity: 1.2,  
            bounce: -0.6   
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(state === 'BART') {
                entity.x = canvas.width / 2;
                entity.y = canvas.height / 2;
            }
        }
        window.addEventListener('resize', resize);
        
        function drawBart(x, y, radius) {
            ctx.fillStyle = '#FFD90F'; 
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x - 25, y - 15, 22, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 25, y - 15, 22, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x - 25, y - 15, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 25, y - 15, 5, 0, Math.PI*2); ctx.fill();
        }

        function drawCheeseball(x, y, radius) {
            ctx.fillStyle = '#F59E0B'; 
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#D97706'; 
            ctx.beginPath(); ctx.arc(x - 20, y - 20, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 30, y - 10, 15, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x - 10, y + 25, 12, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 15, y + 20, 8, 0, Math.PI*2); ctx.fill();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (state === 'BART') {
                drawBart(entity.x, entity.y, entity.radius);
            } else {
                entity.vy += entity.gravity;
                entity.y += entity.vy;

                if (entity.y + entity.radius > canvas.height) {
                    entity.y = canvas.height - entity.radius;
                    entity.vy *= entity.bounce; 
                }

                drawCheeseball(entity.x, entity.y, entity.radius);

                if (state === 'FALLING') {
                    const elapsed = Date.now() - clickTime;
                    
                    // After EXACTLY 1 second (1000ms), transition to Dubstep
                    if (elapsed >= 1000) {
                        state = 'DUBSTEP';
                        dubstepStartTime = Date.now();
                        uiText.innerText = ""; 
                        
                        const gifContainer = document.getElementById('bg-gif');
                        gifContainer.style.display = 'block';
                        gifContainer.style.backgroundImage = "url('https://media.giphy.com/media/3o7TKMt1VVNkHV2PaE/giphy.gif')";
                        
                        dubstepAudio.currentTime = 0;
                        let playPromise = dubstepAudio.play();
                        
                        if (playPromise !== undefined) {
                            playPromise.catch(e => {
                                console.error("Autoplay blocked:", e);
                                uiText.innerText = "CLICK TO ALLOW AUDIO";
                                window.addEventListener('pointerdown', () => {
                                    dubstepAudio.play();
                                    uiText.innerText = "";
                                }, {once:true});
                            });
                        }
                    }
                } else if (state === 'DUBSTEP') {
                    // 3 seconds (3000ms) after dubstep started playing
                    if (Date.now() - dubstepStartTime >= 3000) {
                        window.location.href = 'https://websim.com'; 
                    }
                }
            }

            requestAnimationFrame(animate); 
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (state === 'BART') {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const dist = Math.hypot(mouseX - entity.x, mouseY - entity.y);
                
                if (dist <= entity.radius) {
                    state = 'FALLING';
                    clickTime = Date.now();
                    uiText.innerText = "CHEESEBALL!!!";
                    
                    dubstepAudio.play().then(() => {
                        dubstepAudio.pause();
                        dubstepAudio.currentTime = 0;
                    }).catch(e => console.log("Audio unlock pending..."));
                }
            }
        });

        const titleFrames = [
            "CLICK THE BART",
            "CLICK THE bART",
            "CLICK THE BaRT",
            "CLICK THE BArT",
            "CLICK THE BARt"
        ];
        let titleFrameIndex = 0;
        
        // Loop through the title frames every 100 milliseconds
        setInterval(() => {
            const currentTitle = titleFrames[titleFrameIndex];
            document.title = currentTitle; // Changes browser tab
            
            // Also change the big text on screen if we haven't clicked yet!
            if(state === 'BART') {
                uiText.innerText = currentTitle;
            }
            
            titleFrameIndex = (titleFrameIndex + 1) % titleFrames.length;
        }, 100);

        window.onload = () => {
            resize();
            animate(); 
        };
    </script>
</body>
</html>
