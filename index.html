<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICK THE BART</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            z-index: 10; 
            cursor: pointer;
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 1;
            filter: invert(100%);
            display: none; 
        }

        #flashing-cheeseball {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 5;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 12vw;
            font-weight: 900;
            text-align: center;
            word-wrap: break-word;
            line-height: 1;
        }

        #ui-text {
            position: absolute;
            top: 10%; left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            font-weight: 900;
            color: #111827;
            z-index: 8;
            pointer-events: none;
            text-shadow: 4px 4px 0px white;
            white-space: nowrap;
        }

        #fake-popup-overlay {
            position: fixed; inset: 0;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 20px; z-index: 9999;
        }
        .chrome-alert {
            background: white; border: 1px solid rgba(0,0,0,0.2);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            border-radius: 8px; width: 320px; padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .chrome-alert-text {
            font-size: 14px; color: #202124; margin-bottom: 24px;
            line-height: 1.4;
        }
        .chrome-btn-container {
            display: flex; justify-content: flex-end;
        }
        .chrome-btn {
            background: #1a73e8; color: white; border: none;
            padding: 8px 16px; border-radius: 4px; font-size: 14px;
            font-weight: 500; cursor: pointer;
        }
        .chrome-btn:hover { background: #1557b0; }
    </style>
</head>
<body>

    <video id="bg-video" loop playsinline muted>
        <source src="https://web.archive.org/web/20240716192911im_/https://nez.fyi/sml-assets/explode.webm" type="video/webm">
    </video>

    <div id="flashing-cheeseball">CHEESEBALL<br>CHEESEBALL<br>CHEESEBALL</div>
    <div id="ui-text">CLICK THE BART</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiText = document.getElementById('ui-text');
        const bgVideo = document.getElementById('bg-video');
        const flashingCheeseball = document.getElementById('flashing-cheeseball');
        
        // Audio Setup
        const bgMusic = new Audio('https://web.archive.org/web/20240716192911/https://nez.fyi/sml-assets/ctb2.ogg');
        bgMusic.loop = true;

        const dubstepAudio = new Audio('https://web.archive.org/web/20240716192911/https://nez.fyi/sml-assets/bartstep.ogg');
        dubstepAudio.loop = true; 

        // Image Setup
        const bartImg = new Image();
        bartImg.src = 'https://upload.wikimedia.org/wikipedia/pt/a/aa/Bart_Simpson_200px.png';

        let state = 'WAITING'; // states: 'WAITING', 'BART', 'FALLING', 'DUBSTEP'
        let clickTime = 0;
        let dubstepStartTime = 0;
        
        // Main Entity Object
        const entity = {
            x: 0, y: 0,
            radius: 80, 
            imgWidth: 150, imgHeight: 200,
            vy: 0, gravity: 2.0, bounce: -0.6   
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(state === 'BART' || state === 'WAITING') {
                entity.x = canvas.width / 2;
                entity.y = canvas.height / 2;
            }
        }
        window.addEventListener('resize', resize);

        function drawBartPNG(x, y) {
            if (bartImg.complete && bartImg.naturalHeight !== 0) {
                ctx.drawImage(bartImg, x - entity.imgWidth / 2, y - entity.imgHeight / 2, entity.imgWidth, entity.imgHeight);
            } else {
                ctx.fillStyle = '#FFD90F'; 
                ctx.beginPath(); ctx.arc(x, y, entity.radius, 0, Math.PI * 2); ctx.fill();
            }
        }

        function drawCheeseball(x, y, radius) {
            ctx.fillStyle = '#F59E0B'; 
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
            
            // Cheeseball texture details
            ctx.fillStyle = '#D97706'; 
            ctx.beginPath(); ctx.arc(x - 20, y - 20, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 30, y - 10, 15, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x - 10, y + 25, 12, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 15, y + 20, 8, 0, Math.PI*2); ctx.fill();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (state === 'WAITING') {
                // Wait for popup interaction
            } else if (state === 'BART') {
                drawBartPNG(entity.x, entity.y);
            } else {
                // Apply Rapid Gravity Physics for Cheeseball
                entity.vy += entity.gravity;
                entity.y += entity.vy;

                // Floor Collision
                if (entity.y + entity.radius > canvas.height) {
                    entity.y = canvas.height - entity.radius;
                    entity.vy *= entity.bounce; 
                }

                drawCheeseball(entity.x, entity.y, entity.radius);

                // Phase Transitions
                if (state === 'FALLING') {
                    const elapsed = Date.now() - clickTime;
                    
                    // After EXACTLY 1 second (1000ms), transition to Dubstep
                    if (elapsed >= 1000) {
                        state = 'DUBSTEP';
                        dubstepStartTime = Date.now();
                        
                        uiText.style.display = 'none';
                        bgVideo.style.display = 'none';
                        flashingCheeseball.style.display = 'flex';
                        
                        dubstepAudio.currentTime = 0;
                        dubstepAudio.play().catch(e => console.error("Autoplay blocked:", e));
                    }
                } else if (state === 'DUBSTEP') {
                    // Flash massive text crazy colors
                    const r1 = Math.floor(Math.random() * 255);
                    const g1 = Math.floor(Math.random() * 255);
                    const b1 = Math.floor(Math.random() * 255);
                    const r2 = 255 - r1;
                    const g2 = 255 - g1;
                    const b2 = 255 - b1;
                    
                    flashingCheeseball.style.backgroundColor = `rgb(${r1}, ${g1}, ${b1})`;
                    flashingCheeseball.style.color = `rgb(${r2}, ${g2}, ${b2})`;

                    // Redirect exactly 3 seconds (3000ms) after dubstep starts
                    if (Date.now() - dubstepStartTime >= 3000) {
                        window.location.href = 'https://websim.com'; 
                    }
                }
            }

            requestAnimationFrame(animate); 
        }

        function initGame() {
            // Use real browser popups!
            alert("Ready to experience it?");
            
            // Once the user clicks OK on the alert, start the game
            state = 'BART';
            
            // Start pre-click background video and music
            bgVideo.style.display = 'block';
            bgVideo.play().catch(e => console.error("Video play error:", e));
            bgMusic.play().catch(e => console.error("Audio play error:", e));
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (state === 'BART') {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const dist = Math.hypot(mouseX - entity.x, mouseY - entity.y);
                
                if (dist <= entity.radius) {
                    state = 'FALLING';
                    clickTime = Date.now();
                    
                    // Stop pre-click media
                    bgMusic.pause();
                    bgVideo.pause();
                    bgVideo.style.display = 'none';
                    
                    uiText.innerText = "CHEESEBALL!!!";
                    
                    // Pre-warm audio to prevent block on rapid transition
                    dubstepAudio.play().then(() => {
                        dubstepAudio.pause();
                        dubstepAudio.currentTime = 0;
                    }).catch(e => console.log("Audio pending..."));
                }
            }
        });

        const titleFrames = [
            "CLICK THE BART",
            "CLICK THE bART",
            "CLICK THE BaRT",
            "CLICK THE BArT",
            "CLICK THE BARt"
        ];
        let titleFrameIndex = 0;
        
        setInterval(() => {
            const currentTitle = titleFrames[titleFrameIndex];
            document.title = currentTitle; 
            
            if(state === 'BART') {
                uiText.innerText = currentTitle; 
            }
            
            titleFrameIndex = (titleFrameIndex + 1) % titleFrames.length;
        }, 100);

        window.onload = () => {
            resize();
            animate(); 
            // Call the init function right away to trigger the native alert
            setTimeout(initGame, 100); // Small delay to let canvas render first
        };
    </script>
</body>
</html>
